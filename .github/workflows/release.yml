name: Desktop CI and Releases
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            name: DPet-macOS
          - os: windows-latest
            platform: win
            name: DPet-Windows
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_PASSWORD: ${{ secrets.MAC_CSC_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Load optional signing certificate
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == "mac" && -n "${MAC_CSC_LINK:-}" ]]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$PLATFORM" == "win" && -n "${WIN_CSC_LINK:-}" ]]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Apply version to package
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.GITHUB_REF_TYPE==="tag"?process.env.GITHUB_REF_NAME.replace(/^v/,""):p.version+"-beta."+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");console.log("Packaging",p.version)'
      - name: Build desktop installer
        run: npm run dist:${{ matrix.platform }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DPet-*
          path: downloaded
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            args=()
          else
            tag="v$(node -p "require('./package.json').version")-beta.$RUN_NUMBER"
            args=(--prerelease)
          fi
          mapfile -d '' files < <(find downloaded -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          if [[ ${#files[@]} -eq 0 ]]; then echo 'No release files found'; exit 1; fi
          gh release create "$tag" "${files[@]}" --target "$HEAD_SHA" --title "DPet $tag" --generate-notes "${args[@]}"
