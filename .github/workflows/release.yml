name: Desktop CI and Releases
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Use supported npm resolver
        run: npm install --global npm@11.21.1
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Runtime dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            name: DPet-macOS
          - os: windows-latest
            platform: win
            name: DPet-Windows
          - os: ubuntu-24.04
            platform: linux
            name: DPet-Ubuntu
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_PASSWORD: ${{ secrets.MAC_CSC_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Use supported npm resolver
        run: npm install --global npm@11.21.1
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Load optional signing certificate
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == "mac" && -n "${MAC_CSC_LINK:-}" ]]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$PLATFORM" == "win" && -n "${WIN_CSC_LINK:-}" ]]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Apply version to package
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.GITHUB_REF_TYPE==="tag"?process.env.GITHUB_REF_NAME.replace(/^v/,""):p.version+"-beta."+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");console.log("Packaging",p.version)'
      - name: Build desktop installer
        run: npm run dist:${{ matrix.platform }}
      - name: Generate update metadata
        run: node scripts/write-update-metadata.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/beta.yml
            release/beta-mac.yml
            release/latest.yml
            release/latest-mac.yml
            release/*exe.blockmap
            release/*zip.blockmap
          if-no-files-found: error
          retention-days: 30
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: DPet-*
          path: downloaded
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            args=()
          else
            tag="v$(node -p "require('./package.json').version")-beta.$RUN_NUMBER"
            args=(--prerelease)
          fi
          mapfile -d '' files < <(find downloaded -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name 'beta.yml' -o -name 'beta-mac.yml' -o -name 'latest.yml' -o -name 'latest-mac.yml' -o -name '*exe.blockmap' -o -name '*zip.blockmap' \) -print0)
          if [[ ${#files[@]} -eq 0 ]]; then echo 'No release files found'; exit 1; fi
          gh release create "$tag" "${files[@]}" --target "$HEAD_SHA" --title "DPet $tag" --generate-notes "${args[@]}"
          # Keep a second, fixed download URL for the newest beta, even though
          # GitHub /releases/latest intentionally excludes prereleases.
          # Versioned releases remain immutable and are used by electron-updater.
          mkdir -p direct
          cp downloaded/DPet-Setup-*x64.exe direct/DPet-Windows-Setup.exe
          cp downloaded/DPet-*-mac-arm64.dmg direct/DPet-mac-arm64.dmg
          cp downloaded/DPet-*-mac-x64.dmg direct/DPet-mac-x64.dmg
          cp downloaded/DPet-*-linux-amd64.deb direct/DPet-Ubuntu-amd64.deb
          if ! gh release view current-beta >/dev/null 2>&1; then
            gh release create current-beta --target "$HEAD_SHA" --title "DPet | Current Beta Downloads" \
              --notes "Latest beta installers. See the versioned release for full assets and update metadata." --prerelease
          fi
          gh release upload current-beta direct/* --clobber
