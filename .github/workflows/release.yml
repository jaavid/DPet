name: Desktop CI and Releases
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            name: DPet-macOS
          - os: windows-latest
            platform: win
            name: DPet-Windows
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build desktop installer
        run: npm run dist:${{ matrix.platform }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DPet-*
          path: downloaded
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
            args=()
          else
            tag="v0.1.0-beta.$RUN_NUMBER"
            args=(--prerelease)
          fi
          mapfile -d '' files < <(find downloaded -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          if [[ ${#files[@]} -eq 0 ]]; then echo 'No release files found'; exit 1; fi
          gh release create "$tag" "${files[@]}" --target "$HEAD_SHA" --title "DPet $tag" --generate-notes "${args[@]}"
